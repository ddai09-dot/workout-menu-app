name: Task 20-D2J iOS Dynamic Type Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task20-d2j-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-dynamic-type:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Rebuild canonical v0.9.7 from fixed packages
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="3ba2fc7b668437208507f5277c81861a514b3be56586e10fa6a19928cf8b77b2"
          expected_v091="4d6e2f77f4f18d4a9ebc19994da6039ef42d23bd0a38b7790dc1475b0a20e529"
          test "$(shasum -a 256 implementation-v0.9.1.zip | awk '{print $1}')" = "$expected_v091"
          rm -rf app
          mkdir app
          unzip -q implementation-v0.9.1.zip -d app

          python3 tools/task20_c5_build_canonical_v092.py app implementation-v0.9.2.zip
          rm -rf app && mkdir app && unzip -q implementation-v0.9.2.zip -d app
          python3 tools/task20_c5_verify_canonical_package.py app

          python3 tools/task20_d2a_build_canonical_v093.py app implementation-v0.9.3.zip
          rm -rf app && mkdir app && unzip -q implementation-v0.9.3.zip -d app
          python3 tools/task20_d2a_verify_canonical_v093.py app

          python3 tools/task20_d2b_build_canonical_v094.py app implementation-v0.9.4.zip
          rm -rf app && mkdir app && unzip -q implementation-v0.9.4.zip -d app
          python3 tools/task20_d2b_verify_canonical_v094.py app

          python3 tools/task20_d2e_build_canonical_v095.py app implementation-v0.9.5.zip
          rm -rf app && mkdir app && unzip -q implementation-v0.9.5.zip -d app
          python3 tools/task20_d2e_verify_canonical_v095.py app

          python3 tools/task20_d2g_build_canonical_v096.py app implementation-v0.9.6.zip
          rm -rf app && mkdir app && unzip -q implementation-v0.9.6.zip -d app
          python3 tools/task20_d2g_verify_canonical_v096.py app

          python3 tools/task20_d2g_build_canonical_v097.py app implementation-v0.9.7.zip
          test "$(shasum -a 256 implementation-v0.9.7.zip | awk '{print $1}')" = "$expected"
          rm -rf app && mkdir app && unzip -q implementation-v0.9.7.zip -d app
          python3 tools/task20_d2g_verify_canonical_v097.py app

      - name: Install pinned Flutter SDK from official archive
        id: flutter-sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          result_file="app/build/task20_b_logs/ios/flutter_sdk_install.json"
          mkdir -p "$(dirname "$result_file")"
          python3 app/tools/install_pinned_flutter_sdk.py \
            --version 3.44.6 \
            --channel stable \
            --ref-prefix ee80f08 \
            --install-root "${RUNNER_TOOL_CACHE}/workout-menu-flutter" \
            --result-file "$result_file" \
            --github-output "$GITHUB_OUTPUT"
          flutter_bin_directory="$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)' "$result_file")"
          test -x "$flutter_bin_directory/flutter"
          echo "$flutter_bin_directory" >> "$GITHUB_PATH"

      - name: Run Task 20-B iOS Simulator checks
        shell: bash
        working-directory: app
        run: ./tools/run_task20_b_ios_simulator.sh

      - name: Run Task 20-D1 iOS launch smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          TASK20_D1_LOG_DIR="$GITHUB_WORKSPACE/app/build/task20_d1_ios_launch_smoke" \
            bash tools/task20_d1_ios_launch_smoke.sh \
            "$GITHUB_WORKSPACE/app/build/ios/iphonesimulator/Runner.app"

      - name: Run Task 20-D2J enlarged-text acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          TASK20_D2J_DRIVE_TIMEOUT_SECONDS=1800 \
          TASK20_D2J_LOG_DIR="$GITHUB_WORKSPACE/app/build/task20_d2j_dynamic_type" \
            bash tools/run_task20_d2j_dynamic_type_acceptance.sh \
            "$GITHUB_WORKSPACE/app"

      - name: Verify Task 20-C3 clean analyzer gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c3_verify_analyzer_clean.py \
            app/build/task20_b_logs/ios/flutter_checks/flutter_analyze.log \
            app/tools/run_task20_b_flutter_checks.sh

      - name: Verify Task 20-C4 dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c4_verify_dependency_resolution.py \
            app/pubspec.yaml app/pubspec.lock

      - name: Upload Task 20-D2J evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task20-d2j-ios-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            implementation-v0.9.7.zip
            app/build/task20_b_logs/ios
            app/build/task20_d1_ios_launch_smoke
            app/build/task20_d2j_dynamic_type
            app/pubspec.yaml
            app/pubspec.lock
            app/lib/**/*.g.dart
            app/ios
            app/build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
          retention-days: 14
