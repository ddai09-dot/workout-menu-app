name: Task 20-B2 ZIP Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task20-b2-zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Verify and extract implementation package
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="4d6e2f77f4f18d4a9ebc19994da6039ef42d23bd0a38b7790dc1475b0a20e529"
          actual="$(sha256sum implementation-v0.9.1.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          unzip -t implementation-v0.9.1.zip
          rm -rf app
          mkdir app
          unzip -q implementation-v0.9.1.zip -d app
          test -f app/pubspec.yaml
          test -f app/FILE_MANIFEST.txt

      - name: Apply verified dependency compatibility changes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p app/build/task20_b_logs/flutter
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: Path, source: str, target: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(source) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {source!r}")
              path.write_text(text.replace(source, target), encoding="utf-8")

          pubspec = Path("app/pubspec.yaml")
          replace_once(pubspec, "  custom_lint: ^0.8.1\n", "")
          replace_once(pubspec, "  riverpod_lint: ^3.1.4\n", "")
          replace_once(pubspec, "  build_runner: ^2.15.2\n", "  build_runner: 2.15.1\n")
          replace_once(pubspec, "  drift_dev: ^2.34.4\n", "  drift_dev: 2.34.0\n")

          analysis = Path("app/analysis_options.yaml")
          replace_once(
              analysis,
              "analyzer:\n  plugins:\n    - custom_lint\n  language:\n",
              "plugins:\n  riverpod_lint: 3.1.4\n\nanalyzer:\n  language:\n",
          )

          runner = Path("app/tools/run_task20_b_flutter_checks.sh")
          replace_once(
              runner,
              "PASS is emitted only after pub get, Drift generation, make verify, analyze, custom_lint and flutter test all succeed.",
              "PASS is emitted only after pub get, Drift generation, make verify, analyze including riverpod_lint, and flutter test all succeed.",
          )
          replace_once(
              runner,
              'run_logged_step "custom_lint" "custom_lint.log" dart run custom_lint\n',
              "",
          )

          verifier = Path("app/tools/verify_task20_b_execution_lane.py")
          replace_once(verifier, '    "custom_lint",\n', '    "riverpod_lint",\n')

          makefile = Path("app/Makefile")
          replace_once(
              makefile,
              "analyze:\n\tflutter analyze\n\tdart run custom_lint\n",
              "analyze:\n\tflutter analyze\n",
          )

          workflow_replacements = {
              Path("app/.github/workflows/ci.yml"): (
                  '          echo "$' + '{{ steps.flutter-sdk.outputs.flutter_bin_directory }}" >> "$GITHUB_PATH"\n',
                  '          flutter_bin_directory="$(python3 -c \'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)\' build/task20_b_logs/flutter/flutter_sdk_install.json)"\n          test -x "$flutter_bin_directory/flutter"\n          echo "$flutter_bin_directory" >> "$GITHUB_PATH"\n',
              ),
              Path("app/.github/workflows/ios-build.yml"): (
                  '          echo "$' + '{{ steps.flutter-sdk.outputs.flutter_bin_directory }}" >> "$GITHUB_PATH"\n',
                  '          flutter_bin_directory="$(python3 -c \'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)\' build/task20_b_logs/ios/flutter_sdk_install.json)"\n          test -x "$flutter_bin_directory/flutter"\n          echo "$flutter_bin_directory" >> "$GITHUB_PATH"\n',
              ),
          }
          for path, (source, target) in workflow_replacements.items():
              replace_once(path, source, target)

          evidence = {
              "status": "APPLIED",
              "permanent_replacements": {
                  "removed": ["custom_lint dev dependency", "riverpod_lint pubspec dev dependency", "dart run custom_lint"],
                  "adopted": "analysis_options plugins: riverpod_lint 3.1.4",
                  "reason": "Riverpod 3.1.4 uses analysis_server_plugin; custom_lint is archived and dependency-incompatible."
              },
              "temporary_pins": {
                  "build_runner": {
                      "version": "2.15.1",
                      "reason": "Flutter 3.44.6 pins meta 1.18.0; build_runner 2.15.2 requires analyzer >=13.3.0 and meta ^1.18.3.",
                      "reconsider_when": "Flutter SDK permits meta >=1.18.3"
                  },
                  "drift_dev": {
                      "version": "2.34.0",
                      "reason": "drift_dev 2.34.1+1 and later require analyzer 13, which conflicts with flutter_test, Riverpod and Supabase constraints under Flutter 3.44.6.",
                      "reconsider_when": "Flutter SDK and the full dependency graph resolve with analyzer 13"
                  }
              },
              "runtime_dependencies_changed": False,
          }
          Path("app/build/task20_b_logs/flutter/dependency_compatibility.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          grep -n "build_runner\|drift_dev\|riverpod_lint\|custom_lint" app/pubspec.yaml app/analysis_options.yaml app/tools/run_task20_b_flutter_checks.sh || true

      - name: Install pinned Flutter SDK from official archive
        id: flutter-sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          result_file="app/build/task20_b_logs/flutter/flutter_sdk_install.json"
          mkdir -p "$(dirname "$result_file")"
          python3 app/tools/install_pinned_flutter_sdk.py \
            --version 3.44.6 \
            --channel stable \
            --ref-prefix ee80f08 \
            --install-root "${RUNNER_TOOL_CACHE}/workout-menu-flutter" \
            --result-file "$result_file" \
            --github-output "$GITHUB_OUTPUT"
          flutter_bin_directory="$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)' "$result_file")"
          test -x "$flutter_bin_directory/flutter"
          echo "$flutter_bin_directory" >> "$GITHUB_PATH"

      - name: Run Task 20-B Flutter checks
        shell: bash
        working-directory: app
        run: ./tools/run_task20_b_flutter_checks.sh

      - name: Upload Task 20-B Flutter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task20-b2-zip-flutter-evidence-${{ github.run_id }}
          path: |
            app/build/task20_b_logs/flutter
            app/pubspec.lock
            app/lib/**/*.g.dart
          if-no-files-found: warn
          retention-days: 14
