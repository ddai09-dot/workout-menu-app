name: Task 20-B2 ZIP Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task20-b2-zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify and extract implementation package
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="4d6e2f77f4f18d4a9ebc19994da6039ef42d23bd0a38b7790dc1475b0a20e529"
          actual="$(sha256sum implementation-v0.9.1.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          unzip -t implementation-v0.9.1.zip
          rm -rf app
          mkdir app
          unzip -q implementation-v0.9.1.zip -d app
          test -f app/pubspec.yaml
          test -f app/FILE_MANIFEST.txt

      - name: Apply verified Task 20-B2 patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_b2_apply_patches.py app

      - name: Apply Task 20-C1 analyzer fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c1_apply_analyzer_fixes.py app

      - name: Apply Task 20-C2 deprecated API fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c2_apply_deprecated_api_fixes.py app

      - name: Apply Task 20-C3 style and strict analyzer fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c3_apply_style_and_gate.py app

      - name: Install pinned Flutter SDK from official archive
        id: flutter-sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          result_file="app/build/task20_b_logs/flutter/flutter_sdk_install.json"
          mkdir -p "$(dirname "$result_file")"
          python3 app/tools/install_pinned_flutter_sdk.py \
            --version 3.44.6 \
            --channel stable \
            --ref-prefix ee80f08 \
            --install-root "${RUNNER_TOOL_CACHE}/workout-menu-flutter" \
            --result-file "$result_file" \
            --github-output "$GITHUB_OUTPUT"
          flutter_bin_directory="$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)' "$result_file")"
          test -x "$flutter_bin_directory/flutter"
          echo "$flutter_bin_directory" >> "$GITHUB_PATH"

      - name: Run Task 20-B Flutter checks
        shell: bash
        working-directory: app
        run: ./tools/run_task20_b_flutter_checks.sh

      - name: Verify Task 20-C3 clean analyzer gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c3_verify_analyzer_clean.py \
            app/build/task20_b_logs/flutter/flutter_analyze.log \
            app/tools/run_task20_b_flutter_checks.sh

      - name: Upload Task 20-B Flutter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task20-b2-zip-flutter-evidence-${{ github.run_id }}
          path: |
            app/build/task20_b_logs/flutter
            app/pubspec.lock
            app/lib/**/*.g.dart
          if-no-files-found: warn
          retention-days: 14
