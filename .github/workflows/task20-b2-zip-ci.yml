name: Task 20-B2 ZIP Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task20-b2-zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Verify and extract implementation package
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="4d6e2f77f4f18d4a9ebc19994da6039ef42d23bd0a38b7790dc1475b0a20e529"
          actual="$(sha256sum implementation-v0.9.1.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          unzip -t implementation-v0.9.1.zip
          rm -rf app
          mkdir app
          unzip -q implementation-v0.9.1.zip -d app
          test -f app/pubspec.yaml
          test -f app/FILE_MANIFEST.txt

      - name: Apply verified lint dependency compatibility patch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p app/build/task20_b_logs/flutter
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          source = "  riverpod_lint: ^3.1.4\n"
          target = "  riverpod_lint: 3.1.3\n"
          if text.count(source) != 1:
              raise SystemExit("Expected exactly one riverpod_lint ^3.1.4 entry")
          path.write_text(text.replace(source, target), encoding="utf-8")
          evidence = {
              "status": "APPLIED",
              "package": "riverpod_lint",
              "from": "^3.1.4",
              "to": "3.1.3",
              "reason": "custom_lint 0.8.1 requires analyzer_plugin ^0.13.0 while riverpod_lint 3.1.4 requires ^0.14.0",
              "scope": "dev_dependency_only",
              "temporary": True,
          }
          Path("app/build/task20_b_logs/flutter/dependency_patch.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          grep -n "riverpod_lint" app/pubspec.yaml

      - name: Install pinned Flutter SDK from official archive
        id: flutter-sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          result_file="app/build/task20_b_logs/flutter/flutter_sdk_install.json"
          mkdir -p "$(dirname "$result_file")"
          python3 app/tools/install_pinned_flutter_sdk.py \
            --version 3.44.6 \
            --channel stable \
            --ref-prefix ee80f08 \
            --install-root "${RUNNER_TOOL_CACHE}/workout-menu-flutter" \
            --result-file "$result_file" \
            --github-output "$GITHUB_OUTPUT"
          flutter_bin_directory="$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)' "$result_file")"
          test -x "$flutter_bin_directory/flutter"
          echo "$flutter_bin_directory" >> "$GITHUB_PATH"

      - name: Run Task 20-B Flutter checks
        shell: bash
        working-directory: app
        run: ./tools/run_task20_b_flutter_checks.sh

      - name: Upload Task 20-B Flutter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task20-b2-zip-flutter-evidence-${{ github.run_id }}
          path: |
            app/build/task20_b_logs/flutter
            app/pubspec.lock
            app/lib/**/*.g.dart
          if-no-files-found: warn
          retention-days: 14
