name: Task 20-B2 iOS ZIP Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task20-b2-ios-zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-integration:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Verify and extract implementation package
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="4d6e2f77f4f18d4a9ebc19994da6039ef42d23bd0a38b7790dc1475b0a20e529"
          actual="$(shasum -a 256 implementation-v0.9.1.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          unzip -t implementation-v0.9.1.zip
          rm -rf app
          mkdir app
          unzip -q implementation-v0.9.1.zip -d app
          test -f app/pubspec.yaml
          test -f app/FILE_MANIFEST.txt

      - name: Apply verified Task 20-B2 patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_b2_apply_patches.py app

      - name: Install pinned Flutter SDK from official archive
        id: flutter-sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          result_file="app/build/task20_b_logs/ios/flutter_sdk_install.json"
          mkdir -p "$(dirname "$result_file")"
          python3 app/tools/install_pinned_flutter_sdk.py \
            --version 3.44.6 \
            --channel stable \
            --ref-prefix ee80f08 \
            --install-root "${RUNNER_TOOL_CACHE}/workout-menu-flutter" \
            --result-file "$result_file" \
            --github-output "$GITHUB_OUTPUT"
          flutter_bin_directory="$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)' "$result_file")"
          test -x "$flutter_bin_directory/flutter"
          echo "$flutter_bin_directory" >> "$GITHUB_PATH"

      - name: Run Task 20-B iOS Simulator checks
        shell: bash
        working-directory: app
        run: ./tools/run_task20_b_ios_simulator.sh

      - name: Upload Task 20-B iOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task20-b2-ios-evidence-${{ github.run_id }}
          path: |
            app/build/task20_b_logs/ios
            app/build/task20_b_logs/flutter
            app/pubspec.lock
            app/lib/**/*.g.dart
            app/ios
            app/build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
          retention-days: 14
