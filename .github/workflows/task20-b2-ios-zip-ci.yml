name: Task 20-B2 iOS ZIP Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task20-b2-ios-zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-integration:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore, verify and extract canonical implementation package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          parts = sorted(Path('.').glob('implementation-v0.9.2.zip.b64.part*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 canonical ZIP parts; found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='ascii') for path in parts)
          Path('implementation-v0.9.2.zip').write_bytes(
              base64.b64decode(encoded, validate=True)
          )
          PY
          expected="b35f8f15740fb0e30979bed4eb836fd315d466bb0bd489fc5c70b5749535cf98"
          actual="$(shasum -a 256 implementation-v0.9.2.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          unzip -t implementation-v0.9.2.zip
          rm -rf app
          mkdir app
          unzip -q implementation-v0.9.2.zip -d app
          test -f app/pubspec.yaml
          test -f app/FILE_MANIFEST.txt

      - name: Verify Task 20-C5 canonical package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c5_verify_canonical_package.py app

      - name: Install pinned Flutter SDK from official archive
        id: flutter-sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          result_file="app/build/task20_b_logs/ios/flutter_sdk_install.json"
          mkdir -p "$(dirname "$result_file")"
          python3 app/tools/install_pinned_flutter_sdk.py \
            --version 3.44.6 \
            --channel stable \
            --ref-prefix ee80f08 \
            --install-root "${RUNNER_TOOL_CACHE}/workout-menu-flutter" \
            --result-file "$result_file" \
            --github-output "$GITHUB_OUTPUT"
          flutter_bin_directory="$(python3 -c 'import json,sys; from pathlib import Path; print(Path(json.load(open(sys.argv[1], encoding="utf-8"))["flutter_bin"]).parent)' "$result_file")"
          test -x "$flutter_bin_directory/flutter"
          echo "$flutter_bin_directory" >> "$GITHUB_PATH"

      - name: Run Task 20-B iOS Simulator checks
        shell: bash
        working-directory: app
        run: ./tools/run_task20_b_ios_simulator.sh

      - name: Verify Task 20-C3 clean analyzer gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c3_verify_analyzer_clean.py \
            app/build/task20_b_logs/ios/flutter_checks/flutter_analyze.log \
            app/tools/run_task20_b_flutter_checks.sh

      - name: Verify Task 20-C4 dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/task20_c4_verify_dependency_resolution.py \
            app/pubspec.yaml app/pubspec.lock

      - name: Upload Task 20-B iOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task20-b2-ios-evidence-${{ github.run_id }}
          path: |
            app/build/task20_b_logs/ios
            app/build/task20_b_logs/flutter
            app/pubspec.yaml
            app/pubspec.lock
            app/lib/**/*.g.dart
            app/ios
            app/build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
          retention-days: 14
