name: Task 20-B2 iOS ZIP Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task20-b2-ios-zip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-integration:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run v0.9.22 current-head iOS acceptance with D2K
        shell: bash
        run: bash tools/run_task20_d2k_v0922_current_head_ios_ci.sh

      - name: Upload Task 20-B iOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task20-b2-ios-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            implementation-v0.9.2.zip
            implementation-v0.9.3.zip
            implementation-v0.9.4.zip
            implementation-v0.9.5.zip
            implementation-v0.9.6.zip
            implementation-v0.9.7.zip
            implementation-v0.9.10.zip
            implementation-v0.9.11.zip
            implementation-v0.9.12.zip
            implementation-v0.9.13.zip
            implementation-v0.9.15.zip
            implementation-v0.9.16.zip
            implementation-v0.9.17.zip
            implementation-v0.9.18.zip
            implementation-v0.9.19.zip
            implementation-v0.9.20.zip
            implementation-v0.9.21.zip
            implementation-v0.9.22.zip
            app/build/task20_b_logs/ios
            app/build/task20_b_logs/flutter
            app/build/task20_d1_ios_launch_smoke
            app/build/task20_d2h_restart_persistence
            app/build/task20_d2i_local_data_reset
            app/build/task20_d2a_ios_ui_acceptance
            app/build/task20_d2c_onboarding_resume
            app/build/task20_d2d_weekly_planner_resume
            app/build/task20_d2e_workout_core_flow
            app/build/task20_d2f_records_progression
            app/build/task20_d2g_my_page_settings
            app/build/task20_d2k_reset_interruption
            app/pubspec.yaml
            app/pubspec.lock
            app/lib/**/*.g.dart
            app/ios
            app/build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
          retention-days: 14
